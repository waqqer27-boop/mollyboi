<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mollyboi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
body{font-family:Arial,sans-serif;background:#000;color:#fff;margin:0;padding:20px;padding-bottom:80px}
h1{text-align:center;font-size:32px;letter-spacing:3px;margin-bottom:20px}
.stats{text-align:center;margin-bottom:20px;color:#aaa;font-size:14px}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0;z-index:1000;backdrop-filter:blur(5px)}
.bottom-nav button{background:none;border:none;color:#888;font-size:18px;transition:.3s}
.bottom-nav button.active{color:#fff;transform:scale(1.2)}
.container{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap}
.column{background:#111;padding:15px;border-radius:10px;width:23%;border:1px solid #333;display:flex;flex-direction:column;margin-bottom:20px}
.column h2{text-align:center;font-weight:normal;border-bottom:1px solid #333;padding-bottom:10px;font-size:16px}
input,button{padding:8px;margin-top:5px;border-radius:6px;border:1px solid #444;background:#000;color:#fff}
button{cursor:pointer;transition:.3s}
button:hover{background:#fff;color:#000}
ul{list-style:none;padding:0;margin-top:10px;flex-grow:1}
li{background:#000;border:1px solid #333;padding:8px;margin-bottom:10px;border-radius:8px;display:flex;align-items:center;gap:8px;transition:.3s}
li.removing{opacity:0;transform:scale(.8)}
.movie-content{display:flex;align-items:center;gap:10px;flex-grow:1}
.poster{width:40px;height:60px;object-fit:cover;border-radius:5px;display:none;cursor:pointer}
.add-poster{width:25px;height:25px;font-size:16px;padding:0}
.delete,.favorite{font-size:14px;padding:4px 8px}
.delete{margin-left:auto}
.favorite.active{color:red;border-color:red}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);justify-content:center;align-items:center}
#modal img{max-width:90%;max-height:90%;border-radius:10px}
@media(max-width:900px){.column{width:48%}}
@media(max-width:600px){.container{flex-direction:column}.column{width:100%}.poster{width:60px;height:90px}}
</style>
</head>
<body>

<h1>mollyboi</h1>

<div class="stats">
<span id="totalCount">Всего фильмов: 0</span> | 
<span id="watchedCount">Посмотрено: 0</span> | 
<span id="favCount">Избранное: 0</span>
</div>

<div class="container">
<div class="column" id="watchColumn"><h2>Хочу посмотреть</h2><input id="watchInput" placeholder="Название фильма"><button onclick="addMovie('watch')">Добавить</button><ul id="watchList"></ul></div>
<div class="column" id="watchedColumn"><h2>Уже посмотрел</h2><input id="watchedInput" placeholder="Название фильма"><button onclick="addMovie('watched')">Добавить</button><ul id="watchedList"></ul></div>
<div class="column" id="releaseColumn"><h2>Жду выхода</h2><input id="releaseInput" placeholder="Название фильма"><button onclick="addMovie('release')">Добавить</button><ul id="releaseList"></ul></div>
<div class="column" id="favoriteColumn"><h2>Избранное</h2><ul id="favoriteList"></ul></div>
</div>

<div class="bottom-nav">
<button onclick="navigate('watchColumn',this)">🎬</button>
<button onclick="navigate('watchedColumn',this)">✔</button>
<button onclick="navigate('releaseColumn',this)">⏳</button>
<button onclick="navigate('favoriteColumn',this)">♥</button>
</div>

<div id="modal" onclick="this.style.display='none'"><img id="modalImg"></div>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'))}
function navigate(id,btn){document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById(id).scrollIntoView({behavior:'smooth'})}

let db;
const request=indexedDB.open('mollyboiDB',1);
request.onupgradeneeded=e=>{
 db=e.target.result;
 db.createObjectStore('movies',{keyPath:'id'});
};
request.onsuccess=e=>{db=e.target.result;render();};

function addMovie(type){
 const input=document.getElementById(type+'Input');
 if(!input.value.trim())return;
 const tx=db.transaction('movies','readwrite');
 tx.objectStore('movies').add({id:Date.now(),title:input.value,type:type,favorite:false,poster:null});
 tx.oncomplete=()=>{input.value='';render();};
}

function deleteMovie(id){
 const tx=db.transaction('movies','readwrite');
 tx.objectStore('movies').delete(id);
 tx.oncomplete=render;
}

function toggleFavorite(movie){
 movie.favorite=!movie.favorite;
 const tx=db.transaction('movies','readwrite');
 tx.objectStore('movies').put(movie);
 tx.oncomplete=render;
}

function updatePoster(movie,file){
 movie.poster=file; // сохраняем Blob в оригинальном качестве
 const tx=db.transaction('movies','readwrite');
 tx.objectStore('movies').put(movie);
 tx.oncomplete=render;
}

function render(){
 ['watch','watched','release'].forEach(t=>document.getElementById(t+'List').innerHTML='');
 document.getElementById('favoriteList').innerHTML='';
 const tx=db.transaction('movies','readonly');
 tx.objectStore('movies').getAll().onsuccess=e=>{
  const movies=e.target.result;
  movies.forEach(movie=>{
    const li=document.createElement('li');
    const addBtn=document.createElement('button');addBtn.textContent='+';addBtn.className='add-poster';
    const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/*';fileInput.style.display='none';
    const img=document.createElement('img');img.className='poster';
    if(movie.poster){
      const url=URL.createObjectURL(movie.poster);
      img.src=url;
      img.style.display='block';
      img.onclick=()=>{document.getElementById('modalImg').src=url;document.getElementById('modal').style.display='flex'};
    }
    addBtn.onclick=()=>fileInput.click();
    fileInput.onchange=()=>updatePoster(movie,fileInput.files[0]);

    const content=document.createElement('div');content.className='movie-content';
    content.appendChild(img);
    content.appendChild(document.createTextNode(movie.title));

    const fav=document.createElement('button');fav.textContent='♥';fav.className='favorite';
    if(movie.favorite)fav.classList.add('active');
    fav.onclick=()=>toggleFavorite(movie);

    const del=document.createElement('button');del.textContent='X';del.className='delete';
    del.onclick=()=>{li.classList.add('removing');setTimeout(()=>deleteMovie(movie.id),300)};

    li.append(addBtn,fileInput,content,fav,del);

    if(movie.favorite)document.getElementById('favoriteList').appendChild(li.cloneNode(true));
    document.getElementById(movie.type+'List').appendChild(li);
  });
  updateStats(movies);
 };
}

function updateStats(movies){
 document.getElementById('totalCount').textContent='Всего фильмов: '+movies.length;
 document.getElementById('watchedCount').textContent='Посмотрено: '+movies.filter(m=>m.type==='watched').length;
 document.getElementById('favCount').textContent='Избранное: '+movies.filter(m=>m.favorite).length;
}
</script>

</body>
</html>
